name: One-Time Contribution Batch

on:
  workflow_dispatch:
    inputs:
      count:
        description: "How many commits to generate"
        required: true
        default: "800"
      target_date:
        description: "Date that receives the commits (YYYY-MM-DD)"
        required: true
        default: "2026-09-17"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Generate contribution commits
        shell: bash
        env:
          COUNT: ${{ inputs.count }}
          TARGET_DATE: ${{ inputs.target_date }}
          ACTOR: ${{ github.actor }}
          ACTOR_ID: ${{ github.actor_id }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          if ! [[ "$COUNT" =~ ^[0-9]+$ ]] || [ "$COUNT" -lt 1 ]; then
            echo "count must be a positive whole number"
            exit 1
          fi

          if ! [[ "$TARGET_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "target_date must use YYYY-MM-DD"
            exit 1
          fi

          git config user.name "$ACTOR"
          git config user.email "${ACTOR_ID}+${ACTOR}@users.noreply.github.com"

          git pull --ff-only origin "$DEFAULT_BRANCH"

          COMMIT_DATE="${TARGET_DATE}T12:00:00+08:00"
          MARKER_FILE=".contribution-batch.log"

          for i in $(seq 1 "$COUNT"); do
            printf "%s | batch commit %04d of %04d\n" "$TARGET_DATE" "$i" "$COUNT" >> "$MARKER_FILE"
            git add "$MARKER_FILE"
            GIT_AUTHOR_DATE="$COMMIT_DATE" \
            GIT_COMMITTER_DATE="$COMMIT_DATE" \
              git commit --quiet -m "Batch contribution ${i}/${COUNT}"
          done

          git push origin "HEAD:${DEFAULT_BRANCH}"

          echo "Created and pushed ${COUNT} commits dated ${TARGET_DATE}."
